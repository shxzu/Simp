name: Java CI with Maven

on:
  push:
    branches: [ "recode" ]
  pull_request:
    branches: [ "recode" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
      - name: Create distribution zip
        run: |
          # Create staging directory
          mkdir -p staging
          # Copy both files to staging
          cp target/Simp.jar staging/
          cp Simp.json staging/
          # Create zip from staging directory contents
          cd staging && zip -r ../Simp.zip .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simp
          path: Simp.zip